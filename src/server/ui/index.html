<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" id="themeColor" content="#ffffff"/>
<title>Chrome 工作区管理器</title>
<script>
  // 首帧前应用主题，避免暗色模式闪烁（shadcn 暗色模式约定：.dark class 挂在 html 上）
  try {
    var t = localStorage.getItem('cw-theme');
    var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {}
</script>
<style>
  /* ============ shadcn 设计令牌（zinc 主题，OKLCH）============ */
  :root {
    color-scheme: light;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --destructive-foreground: oklch(0.985 0 0);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.5rem;
    /* 自定义语义令牌：运行中状态（按 shadcn customization 规范新增） */
    --success: oklch(0.723 0.219 149.579);
    --success-foreground: oklch(0.985 0 0);
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
    --shadow-lg: 0 12px 32px -4px rgb(0 0 0 / 0.16), 0 4px 8px -4px rgb(0 0 0 / 0.06);
  }
  .dark {
    color-scheme: dark;
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.145 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.145 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --destructive-foreground: oklch(0.985 0 0);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --success: oklch(0.723 0.219 149.579);
    --success-foreground: oklch(0.145 0 0);
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.4);
    --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.4);
    --shadow-lg: 0 12px 32px -4px rgb(0 0 0 / 0.6), 0 4px 8px -4px rgb(0 0 0 / 0.4);
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0; overflow-x: hidden;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  [id] { scroll-margin-top: 80px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--primary); color: var(--primary-foreground);
    padding: 8px 14px; border-radius: 0 0 8px 0; font-size: 13px; font-weight: 500;
  }
  .skip-link:focus { left: 0; outline-offset: 0; }

  /* ============ Header ============ */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--background); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; border-radius: calc(var(--radius) - 2px); flex: none;
    background: linear-gradient(135deg, var(--primary), var(--primary)); color: var(--primary-foreground);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 10px; flex: none; }
  #serverStatus { font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .icon-btn {
    width: 36px; height: 36px; padding: 0; border-radius: calc(var(--radius) - 2px);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; color: var(--muted-foreground);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .icon-btn:hover { background: var(--accent); color: var(--accent-foreground); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ============ 布局 ============ */
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 48px; }

  /* ============ Card（完整组合）============ */
  .card {
    background: var(--card); color: var(--card-foreground);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .card-header { padding: 18px 20px 4px; }
  .card-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .card-title #count { color: var(--muted-foreground); font-weight: 400; font-size: 13px; margin-left: 4px; }
  .card-description { font-size: 13px; color: var(--muted-foreground); margin: 4px 0 0; }
  .card-content { padding: 12px 20px 20px; }

  /* ============ 表单（Field + Label + Input）============ */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: 13px; font-weight: 500; color: var(--foreground); line-height: 1.3; }
  .field-hint { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; }
  .field-hint.badge-line { margin-top: 10px; }
  .input {
    display: flex; height: 36px; width: 100%;
    border-radius: calc(var(--radius) - 2px); border: 1px solid var(--input);
    background: transparent; padding: 0 10px;
    font-size: 13px; font-family: inherit; color: var(--foreground);
    transition: box-shadow .12s ease, border-color .12s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .input::placeholder { color: var(--muted-foreground); }
  .input:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring), 0 0 0 4px var(--background); }
  .input:disabled { opacity: .5; cursor: not-allowed; }
  input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  #addForm { display: grid; grid-template-columns: 1.1fr 1.5fr 1fr 1.4fr auto; gap: 10px; align-items: end; }
  #importForm { display: grid; grid-template-columns: 1.1fr 1.5fr 1fr auto; gap: 10px; align-items: end; }
  .import-opts {
    margin: 14px 0 0; padding: 0; border: none;
    display: flex; flex-wrap: wrap; gap: 6px 18px;
  }
  .import-opts legend { font-size: 11px; color: var(--muted-foreground); padding: 0 0 6px; }
  .import-opts label { font-size: 13px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }

  /* ============ Button（shadcn 变体）============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 36px; padding: 0 16px; border-radius: calc(var(--radius) - 2px);
    font-size: 13px; font-weight: 500; font-family: inherit; line-height: 1;
    border: 1px solid transparent; cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: transform .12s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; border-radius: calc(var(--radius) - 3px); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover:not(:disabled) { background: color-mix(in oklab, var(--primary) 90%, transparent); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .btn-secondary:hover:not(:disabled) { background: color-mix(in oklab, var(--secondary) 80%, transparent); }
  .btn-outline { background: var(--background); border-color: var(--border); color: var(--foreground); }
  .btn-outline:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
  .btn-ghost { background: transparent; color: var(--foreground); }
  .btn-ghost:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
  .btn-danger { background: var(--destructive); color: var(--destructive-foreground); }
  .btn-danger:hover:not(:disabled) { background: color-mix(in oklab, var(--destructive) 90%, transparent); }
  .btn-ghost-danger { background: transparent; color: var(--destructive); }
  .btn-ghost-danger:hover:not(:disabled) { background: color-mix(in oklab, var(--destructive) 10%, transparent); }

  /* ============ 工作区列表 ============ */
  .ws-list { display: flex; flex-direction: column; }
  .ws-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; min-width: 0; }
  .ws-row + .ws-row { border-top: 1px solid var(--border); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status-dot.running { background: var(--success); box-shadow: 0 0 0 3px color-mix(in oklab, var(--success) 20%, transparent); }
  .status-dot.stopped { background: var(--muted-foreground); opacity: .6; }
  .ws-info { flex: 1; min-width: 0; }
  .ws-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ws-name .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .badge {
    display: inline-flex; align-items: center; flex: none;
    border-radius: calc(var(--radius) - 4px); border: 1px solid transparent;
    padding: 1px 8px; font-size: 11px; font-weight: 600; line-height: 1.6;
  }
  .badge-success { background: var(--success); color: var(--success-foreground); border-color: transparent; }
  .badge-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: transparent; }
  .badge-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
  .pid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; flex: none; }
  .ws-meta { font-size: 12px; color: var(--muted-foreground); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-actions { display: flex; gap: 6px; flex: none; }

  /* 空状态（shadcn Empty 组合） */
  .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 40px 0; text-align: center; }
  .empty-icon { color: var(--muted-foreground); margin-bottom: 2px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--foreground); }
  .empty-desc { font-size: 13px; color: var(--muted-foreground); line-height: 1.6; }

  /* 骨架屏（shadcn Skeleton） */
  .skeleton { background: var(--muted); border-radius: calc(var(--radius) - 2px); animation: cw-pulse 1.6s ease-in-out infinite; }
  @keyframes cw-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .skeleton-list .ws-row { border-top: none; }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 24px; left: 50%; z-index: 60;
    transform: translate(-50%, 16px); opacity: 0;
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); pointer-events: none;
    padding: 10px 16px; font-size: 13px; max-width: min(90vw, 480px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============ Dialog ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; padding: 16px;
    background: color-mix(in oklab, var(--foreground) 40%, transparent);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px);
    box-shadow: var(--shadow-lg); width: 420px; max-width: 100%; max-height: 88vh;
    overflow-y: auto; overscroll-behavior: contain; padding: 22px 24px;
  }
  .modal-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .modal-desc { font-size: 13px; color: var(--muted-foreground); margin: 6px 0 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal .field-hint { margin: -8px 0 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* ============ 响应式 ============ */
  @media (max-width: 820px) { #addForm, #importForm { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) {
    #addForm, #importForm { grid-template-columns: 1fr; }
    .ws-actions { flex-wrap: wrap; }
    main { padding: 16px 12px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">◆</div>
    <h1>Chrome 工作区管理器</h1>
  </div>
  <div class="header-right">
    <span id="serverStatus" role="status" aria-live="polite">连接中…</span>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="切换到深色模式">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </div>
</header>
<main id="main">
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">新增工作区</h2>
      <p class="card-description">创建一个独立配置的 Chrome 实例</p>
    </div>
    <div class="card-content">
      <form id="addForm">
        <div class="field">
          <label for="add-name">名称</label>
          <input class="input" id="add-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位" placeholder="如 dev…" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="add-homepage">默认首页 URL</label>
          <input class="input" id="add-homepage" name="homepage" type="url" placeholder="https://…" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="add-port">调试端口</label>
          <input class="input" id="add-port" name="debugPort" type="number" min="1" max="65535" placeholder="如 9222…" autocomplete="off"/>
        </div>
        <div class="field">
          <label for="add-notes">备注</label>
          <input class="input" id="add-notes" name="notes" placeholder="可选…" autocomplete="off"/>
        </div>
        <button type="submit" class="btn btn-primary" id="addBtn">创建</button>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2 class="card-title">导入现有 Chrome 配置</h2>
      <p class="card-description">复用现有 Chrome 的登录态、书签与扩展</p>
    </div>
    <div class="card-content">
      <form id="importForm">
        <div class="field">
          <label for="imp-name">名称</label>
          <input class="input" id="imp-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位" placeholder="如 work…" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="imp-source">源 user-data-dir</label>
          <input class="input" id="imp-source" name="source" placeholder="留空 = 默认 Chrome…" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="imp-profile">profile</label>
          <input class="input" id="imp-profile" name="profile" placeholder="缺省 Default…" autocomplete="off" spellcheck="false"/>
        </div>
        <button type="submit" class="btn btn-primary" id="importBtn">导入</button>
      </form>
      <fieldset class="import-opts">
        <legend>导入选项</legend>
        <label><input type="checkbox" id="withCache"/> 连同缓存一起复制（体积大）</label>
        <label><input type="checkbox" id="withExtensions" checked/> 保留扩展（1G+ 常见）</label>
      </fieldset>
      <p class="field-hint badge-line">提示：请先退出源 Chrome 再导入。</p>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2 class="card-title">工作区列表 <span id="count"></span></h2>
      <p class="card-description">管理各工作区的启动、关闭与编辑</p>
    </div>
    <div class="card-content">
      <div id="wsList">
        <div class="skeleton-list" aria-hidden="true">
          <div class="ws-row"><span class="skeleton" style="width:8px;height:8px;border-radius:50%"></span><div style="flex:1;min-width:0"><div class="skeleton" style="width:36%;height:14px"></div><div class="skeleton" style="width:64%;height:12px;margin-top:8px"></div></div><div class="skeleton" style="width:120px;height:28px"></div></div>
          <div class="ws-row"><span class="skeleton" style="width:8px;height:8px;border-radius:50%"></span><div style="flex:1;min-width:0"><div class="skeleton" style="width:28%;height:14px"></div><div class="skeleton" style="width:52%;height:12px;margin-top:8px"></div></div><div class="skeleton" style="width:120px;height:28px"></div></div>
          <div class="ws-row"><span class="skeleton" style="width:8px;height:8px;border-radius:50%"></span><div style="flex:1;min-width:0"><div class="skeleton" style="width:32%;height:14px"></div><div class="skeleton" style="width:58%;height:12px;margin-top:8px"></div></div><div class="skeleton" style="width:120px;height:28px"></div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="editModal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
  <div class="modal">
    <h2 class="modal-title" id="editModalTitle">编辑工作区</h2>
    <p class="modal-desc">修改后立即保存生效。</p>
    <form id="editForm">
      <div class="field">
        <label for="edit-name">名称</label>
        <input class="input" id="edit-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field-hint" id="editRunningHint" style="display:none">工作区运行中，名称不可修改（仅可编辑首页/端口/备注）。</div>
      <div class="field">
        <label for="edit-homepage">默认首页 URL（留空清除）</label>
        <input class="input" id="edit-homepage" name="homepage" type="url" placeholder="https://…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="edit-port">调试端口（留空清除）</label>
        <input class="input" id="edit-port" name="debugPort" type="number" min="1" max="65535" placeholder="9222…" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="edit-notes">备注</label>
        <input class="input" id="edit-notes" name="notes" placeholder="可选…" autocomplete="off"/>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="editCancel">取消</button>
        <button type="submit" class="btn btn-primary" id="editSave">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const listEl = $('#wsList'), statusEl = $('#serverStatus'), toastEl = $('#toast');
const editModal = $('#editModal'), editForm = $('#editForm');
const editName = $('#edit-name'), editHomepage = $('#edit-homepage'), editPort = $('#edit-port'), editNotes = $('#edit-notes');
let editingWs = null;
let timer = null;
let lastFocused = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- 主题（shadcn .dark class 约定） ----------
const MOON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
const SUN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
function setTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  try { localStorage.setItem('cw-theme', t); } catch {}
  const btn = $('#themeToggle');
  btn.innerHTML = t === 'dark' ? SUN : MOON;
  btn.setAttribute('aria-label', t === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  $('#themeColor').content = t === 'dark' ? '#1c1c1e' : '#ffffff';
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('cw-theme'); } catch {}
  const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
}
$('#themeToggle').addEventListener('click', () => {
  setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
});
initTheme();

// ---------- 工作区列表 ----------
async function load() {
  try {
    const { workspaces } = await api('/api/workspaces');
    window.__wsCache = {};
    workspaces.forEach((w) => { window.__wsCache[w.name] = w; });
    statusEl.textContent = '● 服务正常';
    statusEl.style.color = 'var(--success)';
    $('#count').textContent = workspaces.length ? `（${workspaces.length} 个）` : '';
    if (!workspaces.length) {
      listEl.innerHTML = '<div class="empty"><div class="empty-icon">■</div><div class="empty-title">暂无工作区</div><div class="empty-desc">先在上方创建一个，或从现有 Chrome 配置导入</div></div>';
      return;
    }
    listEl.innerHTML = workspaces.map((w) => `
      <div class="ws-row" data-name="${esc(w.name)}">
        <span class="status-dot ${w.running ? 'running' : 'stopped'}" aria-hidden="true"></span>
        <div class="ws-info">
          <div class="ws-name">
            <span class="name">${esc(w.name)}</span>
            <span class="badge ${w.running ? 'badge-success' : 'badge-secondary'}">${w.running ? '运行中' : '已停止'}</span>
            ${w.running ? '<span class="pid">' + esc(w.pid || '') + '</span>' : ''}
          </div>
          <div class="ws-meta">${esc(w.dir)}${w.homepage ? ' · ' + esc(w.homepage) : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>
        </div>
        <div class="ws-actions">
          <button class="btn btn-sm btn-primary" data-act="open">打开</button>
          <button class="btn btn-sm btn-outline" data-act="close" ${w.running ? '' : 'disabled'}>关闭</button>
          <button class="btn btn-sm btn-ghost" data-act="edit">编辑</button>
          <button class="btn btn-sm btn-ghost-danger" data-act="del">删除</button>
        </div>
      </div>`).join('');
  } catch (e) {
    statusEl.textContent = '○ 无法连接服务';
    statusEl.style.color = 'var(--muted-foreground)';
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">!</div><div class="empty-title">无法连接服务</div><div class="empty-desc">${esc(e.message)}<br/>请先运行：chrome-ws server start</div></div>`;
  }
}

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const name = btn.closest('.ws-row').dataset.name;
  const act = btn.dataset.act;
  try {
    if (act === 'open') await api(`/api/workspaces/${encodeURIComponent(name)}/open`, { method: 'POST' });
    if (act === 'close') await api(`/api/workspaces/${encodeURIComponent(name)}/close`, { method: 'POST' });
    if (act === 'edit') return openEdit(name);
    if (act === 'del') {
      if (!confirm(`确定删除工作区「${name}」？`)) return;
      await api(`/api/workspaces/${encodeURIComponent(name)}?purge=0`, { method: 'DELETE' });
    }
    toast(act === 'open' ? `已打开 ${name}` : act === 'close' ? `已关闭 ${name}` : act === 'edit' ? '' : `已删除 ${name}`);
  } catch (err) {
    toast('操作失败: ' + err.message);
  }
  load();
});

// ---------- 编辑弹窗 ----------
function openEdit(name) {
  const w = [...document.querySelectorAll('.ws-row')].find((r) => r.dataset.name === name);
  const running = w?.querySelector('.status-dot').classList.contains('running');
  editingWs = name;
  editName.value = name;
  editName.disabled = running;
  const ws = window.__wsCache?.[name] || {};
  editHomepage.value = ws.homepage || '';
  editPort.value = ws.debugPort || '';
  editNotes.value = ws.notes || '';
  $('#editRunningHint').style.display = running ? 'block' : 'none';
  lastFocused = document.activeElement;
  editModal.style.display = 'flex';
  setTimeout(() => (editName.disabled ? editHomepage : editName).focus(), 50);
}

function closeEdit() {
  editModal.style.display = 'none';
  editingWs = null;
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}

$('#editCancel').addEventListener('click', closeEdit);
editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEdit(); });

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editModal.style.display !== 'none') closeEdit(); });

// 焦点圈定：Tab 在弹窗内循环
editModal.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || editModal.style.display === 'none') return;
  const list = [...editModal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((el) => !el.disabled);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

editForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!editingWs) return;
  const body = { name: editName.value.trim(), homepage: editHomepage.value.trim() || null, debugPort: editPort.value.trim() ? Number(editPort.value) : null, notes: editNotes.value.trim() };
  const btn = $('#editSave');
  btn.disabled = true;
  try {
    await api(`/api/workspaces/${encodeURIComponent(editingWs)}`, { method: 'PATCH', body });
    toast('已保存修改');
    closeEdit();
  } catch (err) {
    toast('保存失败: ' + err.message);
  } finally {
    btn.disabled = false;
  }
  load();
});

// ---------- 新增 ----------
$('#addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!fd.get('name').trim()) return;
  const body = { name: fd.get('name').trim() };
  if (fd.get('homepage')) body.homepage = fd.get('homepage').trim();
  if (fd.get('debugPort')) body.debugPort = Number(fd.get('debugPort'));
  if (fd.get('notes')) body.notes = fd.get('notes').trim();
  const btn = $('#addBtn');
  btn.disabled = true;
  btn.textContent = '创建中…';
  try {
    await api('/api/workspaces', { method: 'POST', body });
    toast('已创建 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('创建失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '创建';
  }
  load();
});

// ---------- 导入 ----------
$('#importForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { name: fd.get('name').trim(), withCache: $('#withCache').checked, withExtensions: $('#withExtensions').checked };
  if (fd.get('source')) body.source = fd.get('source').trim();
  if (fd.get('profile')) body.profile = fd.get('profile').trim();
  const btn = $('#importBtn');
  btn.disabled = true;
  btn.textContent = '导入中…';
  try {
    await api('/api/workspaces/import', { method: 'POST', body });
    toast('已导入 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('导入失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '导入';
  }
  load();
});

load();
setInterval(load, 3000); // 自动刷新运行状态
</script>
</body>
</html>
