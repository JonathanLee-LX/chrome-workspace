<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chrome 工作区管理器</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e2e5ea;
    --text: #1f2329; --muted: #8a919f;
    --primary: #2563eb; --primary-h: #1d4ed8;
    --green: #16a34a; --red: #dc2626; --gray: #9ca3af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  #serverStatus { font-size: 12px; color: var(--muted); }
  main { max-width: 900px; margin: 24px auto; padding: 0 20px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  #addForm { display: grid; grid-template-columns: 1fr 1.4fr 1fr 1.4fr auto; gap: 10px; }
  input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
  input:focus { border-color: var(--primary); }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; background: var(--primary); color: #fff; }
  button:hover { background: var(--primary-h); }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button.ghost:hover { background: #eff6ff; }
  button.danger:hover { background: #fef2f2; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .ws-row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
  .ws-row:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px #d1fae5; }
  .dot.off { background: var(--gray); }
  .ws-info { flex: 1; min-width: 0; }
  .ws-name { font-weight: 600; font-size: 14px; }
  .ws-meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-actions { display: flex; gap: 8px; flex: none; }
  .ws-actions button { padding: 6px 12px; font-size: 12px; }
  .pid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { #addForm { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Chrome 工作区管理器</h1>
  <span id="serverStatus">连接中…</span>
</header>
<main>
  <section class="panel">
    <h2>新增工作区</h2>
    <form id="addForm">
      <input name="name" placeholder="名称（work/personal/dev）" required title="字母/数字/-/_"/>
      <input name="homepage" placeholder="默认首页 URL（可选）"/>
      <input name="debugPort" type="number" placeholder="调试端口（可选）"/>
      <input name="notes" placeholder="备注（可选）"/>
      <button type="submit">创建</button>
    </form>
  </section>

  <section class="panel">
    <h2>导入现有 Chrome 配置</h2>
    <form id="importForm" style="display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:10px;">
      <input name="name" placeholder="名称" required title="字母/数字/-/_"/>
      <input name="source" placeholder="源 user-data-dir（留空=默认 Chrome）"/>
      <input name="profile" placeholder="profile（缺省 Default）"/>
      <button type="submit">导入</button>
    </form>
    <label style="font-size:12px;color:var(--muted);margin-top:10px;display:block;">
      <input type="checkbox" id="withCache" style="width:auto;"/> 连同缓存一起复制（体积大）&nbsp;
      <input type="checkbox" id="withExtensions" checked style="width:auto;"/> 保留扩展（1G+ 常见）&nbsp;
      提示：请先退出源 Chrome 再导入。
    </label>
  </section>

    <div id="wsList"><div class="empty">加载中…</div></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const listEl = $('#wsList'), statusEl = $('#serverStatus'), toastEl = $('#toast');
let timer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function load() {
  try {
    const { workspaces } = await api('/api/workspaces');
    statusEl.textContent = '● 服务正常';
    statusEl.style.color = 'var(--green)';
    $('#count').textContent = workspaces.length ? `（${workspaces.length} 个）` : '';
    if (!workspaces.length) {
      listEl.innerHTML = '<div class="empty">暂无工作区，先在上方创建一个吧</div>';
      return;
    }
    listEl.innerHTML = workspaces.map((w) => `
      <div class="ws-row" data-name="${esc(w.name)}">
        <span class="dot ${w.running ? 'on' : 'off'}"></span>
        <div class="ws-info">
          <div class="ws-name">${esc(w.name)} ${w.running ? '<span class="pid">' + esc(w.pid || '') + '</span>' : ''}</div>
          <div class="ws-meta">${esc(w.dir)}${w.homepage ? ' · ' + esc(w.homepage) : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>
        </div>
        <div class="ws-actions">
          <button class="ghost" data-act="open">打开</button>
          <button class="ghost" data-act="close" ${w.running ? '' : 'disabled'}>关闭</button>
          <button class="danger" data-act="del">删除</button>
        </div>
      </div>`).join('');
  } catch (e) {
    statusEl.textContent = '○ 无法连接服务';
    statusEl.style.color = 'var(--gray)';
    listEl.innerHTML = `<div class="empty">${esc(e.message)}<br/>请先运行：chrome-ws server start</div>`;
  }
}

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const name = btn.closest('.ws-row').dataset.name;
  const act = btn.dataset.act;
  try {
    if (act === 'open') await api(`/api/workspaces/${encodeURIComponent(name)}/open`, { method: 'POST' });
    if (act === 'close') await api(`/api/workspaces/${encodeURIComponent(name)}/close`, { method: 'POST' });
    if (act === 'del') {
      if (!confirm(`确定删除工作区「${name}」？`)) return;
      await api(`/api/workspaces/${encodeURIComponent(name)}?purge=0`, { method: 'DELETE' });
    }
    toast(act === 'open' ? `已打开 ${name}` : act === 'close' ? `已关闭 ${name}` : `已删除 ${name}`);
  } catch (err) {
    toast('操作失败: ' + err.message);
  }
  load();
});

$('#addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { name: fd.get('name').trim() };
  if (fd.get('homepage')) body.homepage = fd.get('homepage').trim();
  if (fd.get('debugPort')) body.debugPort = Number(fd.get('debugPort'));
  if (fd.get('notes')) body.notes = fd.get('notes').trim();
  try {
    await api('/api/workspaces', { method: 'POST', body });
    toast('已创建 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('创建失败: ' + err.message);
  }
  load();
});

$('#importForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { name: fd.get('name').trim(), withCache: $('#withCache').checked, withExtensions: $('#withExtensions').checked };
  if (fd.get('source')) body.source = fd.get('source').trim();
  if (fd.get('profile')) body.profile = fd.get('profile').trim();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = '导入中…';
  try {
    await api('/api/workspaces/import', { method: 'POST', body });
    toast('已导入 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('导入失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '导入';
  }
  load();
});

load();
setInterval(load, 3000); // 自动刷新运行状态
</script>
</body>
</html>
