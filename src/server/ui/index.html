<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" id="themeColor" content="#f6f7f9"/>
<title>Chrome 工作区管理器</title>
<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9; --card: #fff; --border: #e4e7ec;
    --text: #101828; --muted: #667085; --gray: #98a2b3;
    --primary: #2563eb; --primary-h: #1d4ed8; --primary-soft: #eff4ff;
    --green: #12b76a; --green-soft: #ecfdf3; --red: #d92d20; --red-soft: #fef3f2;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --shadow-lg: 0 8px 30px rgba(16,24,40,.14);
    --ring: rgba(37,99,235,.35);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0f1a; --card: #131a2a; --border: #26304a;
    --text: #e6eaf2; --muted: #93a0b4; --gray: #6b7a90;
    --primary: #3b82f6; --primary-h: #60a5fa; --primary-soft: #1b2a4a;
    --green: #22c55e; --green-soft: #12261d; --red: #f87171; --red-soft: #2a1718;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 8px 30px rgba(0,0,0,.5);
    --ring: rgba(96,165,250,.4);
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0; overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  }
  [id] { scroll-margin-top: 80px; }
  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--primary); color: #fff; padding: 8px 14px; border-radius: 0 0 8px 0; font-size: 13px;
  }
  .skip-link:focus { left: 0; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 650; text-wrap: balance;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-right { display: flex; align-items: center; gap: 12px; flex: none; }
  #serverStatus { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .icon-btn {
    width: 30px; height: 30px; padding: 0; border-radius: 8px; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border); color: var(--text);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { background: var(--primary-soft); border-color: var(--primary); }

  main { max-width: 860px; margin: 20px auto; padding: 0 20px; }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 13px; margin: 0 0 14px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .panel h2 #count { font-weight: 400; }

  #addForm { display: grid; grid-template-columns: 1.1fr 1.5fr 1fr 1.4fr auto; gap: 10px; align-items: end; }
  #importForm { display: grid; grid-template-columns: 1.1fr 1.5fr 1fr auto; gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: 12px; font-weight: 500; color: var(--muted); }

  input {
    width: 100%; padding: 8px 10px; font-size: 13px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  input::placeholder { color: var(--gray); }
  input:focus-visible { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  input:disabled { opacity: .55; cursor: not-allowed; }

  button {
    cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 500; font-family: inherit; color: #fff;
    background: var(--primary); transition: transform .12s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: var(--primary-h); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.ghost:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button.danger:hover { background: var(--red-soft); }

  .import-opts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
  .import-opts label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .import-opts input { width: auto; }
  .hint { font-size: 11px; color: var(--muted); margin: 8px 0 0; }

  .ws-row { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--border); }
  .ws-row:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .dot.off { background: var(--gray); }
  .ws-info { flex: 1; min-width: 0; }
  .ws-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ws-name .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .badge {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 500;
    border-radius: 999px; padding: 2px 8px; flex: none;
  }
  .badge.on { color: var(--green); background: var(--green-soft); }
  .badge.off { color: var(--muted); background: var(--bg); }
  .pid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .ws-meta { font-size: 12px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-actions { display: flex; gap: 8px; flex: none; }
  .ws-actions button { padding: 6px 12px; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; z-index: 60;
    transform: translate(-50%, 20px); opacity: 0;
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: var(--shadow-lg); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; padding: 16px;
    background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; width: 400px; max-width: 100%; max-height: 88vh;
    overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--shadow-lg);
  }
  .modal h3 { margin: 0 0 4px; font-size: 15px; }
  .modal .desc { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .modal .field { margin-bottom: 14px; }
  .modal .hint { font-size: 11px; color: var(--muted); margin: -6px 0 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  @media (max-width: 820px) { #addForm, #importForm { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) {
    #addForm, #importForm { grid-template-columns: 1fr; }
    .ws-actions { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">◆</div>
    <h1>Chrome 工作区管理器</h1>
  </div>
  <div class="header-right">
    <span id="serverStatus" role="status" aria-live="polite">连接中…</span>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色/浅色模式">🌙</button>
  </div>
</header>
<main id="main">
  <section class="panel">
    <h2>新增工作区</h2>
    <form id="addForm">
      <div class="field">
        <label for="add-name">名称</label>
        <input id="add-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位" placeholder="如 dev…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="add-homepage">默认首页 URL</label>
        <input id="add-homepage" name="homepage" type="url" placeholder="https://…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="add-port">调试端口</label>
        <input id="add-port" name="debugPort" type="number" min="1" max="65535" placeholder="如 9222…" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="add-notes">备注</label>
        <input id="add-notes" name="notes" placeholder="可选…" autocomplete="off"/>
      </div>
      <button type="submit" id="addBtn">创建</button>
    </form>
  </section>

  <section class="panel">
    <h2>导入现有 Chrome 配置</h2>
    <form id="importForm">
      <div class="field">
        <label for="imp-name">名称</label>
        <input id="imp-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位" placeholder="如 work…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="imp-source">源 user-data-dir</label>
        <input id="imp-source" name="source" placeholder="留空 = 默认 Chrome…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="imp-profile">profile</label>
        <input id="imp-profile" name="profile" placeholder="缺省 Default…" autocomplete="off" spellcheck="false"/>
      </div>
      <button type="submit" id="importBtn">导入</button>
    </form>
    <div class="import-opts">
      <label><input type="checkbox" id="withCache"/> 连同缓存一起复制（体积大）</label>
      <label><input type="checkbox" id="withExtensions" checked/> 保留扩展（1G+ 常见）</label>
    </div>
    <p class="hint">提示：请先退出源 Chrome 再导入。</p>
  </section>

  <section class="panel">
    <h2>工作区列表 <span id="count" style="font-weight:400"></span></h2>
    <div id="wsList"><div class="empty">加载中…</div></div>
  </section>
</main>

<div class="modal-overlay" id="editModal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
  <div class="modal">
    <h3 id="editModalTitle">编辑工作区</h3>
    <p class="desc">修改后立即保存生效。</p>
    <form id="editForm">
      <div class="field">
        <label for="edit-name">名称</label>
        <input id="edit-name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" title="字母/数字开头，可含 -/_，最长 64 位"/>
      </div>
      <div class="hint" id="editRunningHint" style="display:none">工作区运行中，名称不可修改（仅可编辑首页/端口/备注）。</div>
      <div class="field">
        <label for="edit-homepage">默认首页 URL（留空清除）</label>
        <input id="edit-homepage" name="homepage" type="url" placeholder="https://…" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field">
        <label for="edit-port">调试端口（留空清除）</label>
        <input id="edit-port" name="debugPort" type="number" min="1" max="65535" placeholder="9222…" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="edit-notes">备注</label>
        <input id="edit-notes" name="notes" placeholder="可选…" autocomplete="off"/>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="editCancel">取消</button>
        <button type="submit" id="editSave">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const listEl = $('#wsList'), statusEl = $('#serverStatus'), toastEl = $('#toast');
const editModal = $('#editModal'), editForm = $('#editForm');
const editName = $('#edit-name'), editHomepage = $('#edit-homepage'), editPort = $('#edit-port'), editNotes = $('#edit-notes');
let editingWs = null;
let timer = null;
let lastFocused = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- 主题（深色/浅色） ----------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cw-theme', t); } catch {}
  const btn = $('#themeToggle');
  btn.textContent = t === 'dark' ? '☀️' : '🌙';
  btn.setAttribute('aria-label', t === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  const meta = $('#themeColor');
  meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || (t === 'dark' ? '#0b0f1a' : '#f6f7f9');
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('cw-theme'); } catch {}
  const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
}
$('#themeToggle').addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
initTheme();

// ---------- 工作区列表 ----------
async function load() {
  try {
    const { workspaces } = await api('/api/workspaces');
    window.__wsCache = {};
    workspaces.forEach((w) => { window.__wsCache[w.name] = w; });
    statusEl.textContent = '● 服务正常';
    statusEl.style.color = 'var(--green)';
    $('#count').textContent = workspaces.length ? `（${workspaces.length} 个）` : '';
    if (!workspaces.length) {
      listEl.innerHTML = '<div class="empty">暂无工作区，先在上方创建一个吧</div>';
      return;
    }
    listEl.innerHTML = workspaces.map((w) => `
      <div class="ws-row" data-name="${esc(w.name)}">
        <span class="dot ${w.running ? 'on' : 'off'}"></span>
        <div class="ws-info">
          <div class="ws-name">
            <span class="name">${esc(w.name)}</span>
            <span class="badge ${w.running ? 'on' : 'off'}">${w.running ? '运行中' : '已停止'}</span>
            ${w.running ? '<span class="pid">' + esc(w.pid || '') + '</span>' : ''}
          </div>
          <div class="ws-meta">${esc(w.dir)}${w.homepage ? ' · ' + esc(w.homepage) : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>
        </div>
        <div class="ws-actions">
          <button class="ghost" data-act="open">打开</button>
          <button class="ghost" data-act="close" ${w.running ? '' : 'disabled'}>关闭</button>
          <button class="ghost" data-act="edit">编辑</button>
          <button class="danger" data-act="del">删除</button>
        </div>
      </div>`).join('');
  } catch (e) {
    statusEl.textContent = '○ 无法连接服务';
    statusEl.style.color = 'var(--gray)';
    listEl.innerHTML = `<div class="empty">${esc(e.message)}<br/>请先运行：chrome-ws server start</div>`;
  }
}

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const name = btn.closest('.ws-row').dataset.name;
  const act = btn.dataset.act;
  try {
    if (act === 'open') await api(`/api/workspaces/${encodeURIComponent(name)}/open`, { method: 'POST' });
    if (act === 'close') await api(`/api/workspaces/${encodeURIComponent(name)}/close`, { method: 'POST' });
    if (act === 'edit') return openEdit(name);
    if (act === 'del') {
      if (!confirm(`确定删除工作区「${name}」？`)) return;
      await api(`/api/workspaces/${encodeURIComponent(name)}?purge=0`, { method: 'DELETE' });
    }
    toast(act === 'open' ? `已打开 ${name}` : act === 'close' ? `已关闭 ${name}` : act === 'edit' ? '' : `已删除 ${name}`);
  } catch (err) {
    toast('操作失败: ' + err.message);
  }
  load();
});

// ---------- 编辑弹窗 ----------
function openEdit(name) {
  const w = [...document.querySelectorAll('.ws-row')].find((r) => r.dataset.name === name);
  const running = w?.querySelector('.dot').classList.contains('on');
  editingWs = name;
  editName.value = name;
  editName.disabled = running;
  const ws = window.__wsCache?.[name] || {};
  editHomepage.value = ws.homepage || '';
  editPort.value = ws.debugPort || '';
  editNotes.value = ws.notes || '';
  $('#editRunningHint').style.display = running ? 'block' : 'none';
  lastFocused = document.activeElement;
  editModal.style.display = 'flex';
  setTimeout(() => (editName.disabled ? editHomepage : editName).focus(), 50);
}

function closeEdit() {
  editModal.style.display = 'none';
  editingWs = null;
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}

$('#editCancel').addEventListener('click', closeEdit);
editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEdit(); });

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editModal.style.display !== 'none') closeEdit(); });

// 焦点圈定：Tab 在弹窗内循环
editModal.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || editModal.style.display === 'none') return;
  const list = [...editModal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((el) => !el.disabled);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

editForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!editingWs) return;
  const body = { name: editName.value.trim(), homepage: editHomepage.value.trim() || null, debugPort: editPort.value.trim() ? Number(editPort.value) : null, notes: editNotes.value.trim() };
  const btn = $('#editSave');
  btn.disabled = true;
  try {
    await api(`/api/workspaces/${encodeURIComponent(editingWs)}`, { method: 'PATCH', body });
    toast('已保存修改');
    closeEdit();
  } catch (err) {
    toast('保存失败: ' + err.message);
  } finally {
    btn.disabled = false;
  }
  load();
});

// ---------- 新增 ----------
$('#addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!fd.get('name').trim()) return;
  const body = { name: fd.get('name').trim() };
  if (fd.get('homepage')) body.homepage = fd.get('homepage').trim();
  if (fd.get('debugPort')) body.debugPort = Number(fd.get('debugPort'));
  if (fd.get('notes')) body.notes = fd.get('notes').trim();
  const btn = $('#addBtn');
  btn.disabled = true;
  btn.textContent = '创建中…';
  try {
    await api('/api/workspaces', { method: 'POST', body });
    toast('已创建 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('创建失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '创建';
  }
  load();
});

// ---------- 导入 ----------
$('#importForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { name: fd.get('name').trim(), withCache: $('#withCache').checked, withExtensions: $('#withExtensions').checked };
  if (fd.get('source')) body.source = fd.get('source').trim();
  if (fd.get('profile')) body.profile = fd.get('profile').trim();
  const btn = $('#importBtn');
  btn.disabled = true;
  btn.textContent = '导入中…';
  try {
    await api('/api/workspaces/import', { method: 'POST', body });
    toast('已导入 ' + body.name);
    e.target.reset();
  } catch (err) {
    toast('导入失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '导入';
  }
  load();
});

load();
setInterval(load, 3000); // 自动刷新运行状态
</script>
</body>
</html>
